<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中药食材功效展示</title>
    <style>
      body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      header {
        background: linear-gradient(135deg, #4a90e2, #9013fe);
        padding: 20px;
        text-align: center;
        color: #fff;
      }

      header h1 {
        margin: 0;
        font-size: 2.5em;
        letter-spacing: 2px;
      }

      nav {
        background-color: #333;
        overflow: hidden;
      }

      nav a {
        float: left;
        display: block;
        color: #f2f2f2;
        text-align: center;
        padding: 14px 35px;
        text-decoration: none;
        font-size: 17px;
      }

      nav a:hover {
        background-color: #ddd;
        color: black;
      }

      .content {
        padding: 20px;
        max-width: 1200px;
        margin: 20px auto;
        background: #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .content h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #4a90e2;
      }

      .gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
      }

      .gallery-item {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin: 10px;
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        width: calc(25% - 20px); /* Adjust width based on the container */
        box-sizing: border-box; /* Include padding and border in element's total width and height */
      }

      .gallery-item:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }

      .gallery-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }

      .gallery-item .details {
        padding: 20px;
        text-align: center;
      }

      .gallery-item .details h3 {
        margin: 0;
        font-size: 1.5em;
        color: #9013fe;
      }

      .gallery-item .details p {
        margin: 10px 0 0;
        color: #666;
      }

      footer {
        text-align: center;
        padding: 10px 20px;
        background: #4a90e2;
        color: #fff;
      }

      @media screen and (max-width: 768px) {
        .gallery-item {
          width: calc(50% - 20px); /* Adjust for smaller screens */
          margin: 10px auto; /* Center items */
        }
      }

      @media screen and (max-width: 480px) {
        .gallery-item {
          width: 100%; /* Full width on very small screens */
          margin: 10px 0;
        }
      }
      body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(to bottom, #1e1e1e, #121212);
        color: #ffffff;
      }

      header {
        background: linear-gradient(135deg, #4a90e2, #9013fe);
        padding: 20px;
        text-align: center;
        color: #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      header h1 {
        margin: 0;
        font-size: 2.5em;
        letter-spacing: 2px;
        animation: glow 1.5s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 30px #4a90e2,
            0 0 40px #4a90e2, 0 0 50px #4a90e2, 0 0 60px #4a90e2,
            0 0 70px #4a90e2;
        }
        to {
          text-shadow: 0 0 20px #ffffff, 0 0 30px #9013fe, 0 0 40px #9013fe,
            0 0 50px #9013fe, 0 0 60px #9013fe, 0 0 70px #9013fe,
            0 0 80px #9013fe;
        }
      }

      nav {
        background-color: rgba(0, 0, 0, 0.8);
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        padding: 0 10px;
        display: flex;
        justify-content: center;
        animation: slideDown 1s ease-out;
      }

      @keyframes slideDown {
        from {
          transform: translateY(-100%);
        }
        to {
          transform: translateY(0);
        }
      }

      nav a {
        float: left;
        display: block;
        color: #f2f2f2;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
        transition: background-color 0.3s, color 0.3s, transform 0.3s;
      }

      nav a:hover {
        background-color: #ddd;
        color: black;
        transform: scale(1.1);
      }

      .content {
        padding: 20px;
        max-width: 1200px;
        margin: 20px auto;
        background: rgba(51, 51, 51, 0.8);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        backdrop-filter: blur(15px);
        animation: fadeIn 1s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .content h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #4a90e2;
        text-shadow: 0 0 10px #4a90e2;
      }

      .doctor {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .doctor-item {
        background: rgba(68, 68, 68, 0.9);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
      }

      .doctor-item:hover {
        transform: translateY(-10px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        background: linear-gradient(135deg, #4a90e2, #9013fe);
      }

      .doctor-item img {
        width: 100%;
        height: auto;
        border-radius: 10px;
        margin-bottom: 15px;
      }

      .doctor-item h3 {
        margin: 0 0 10px;
        color: #4a90e2;
      }

      .doctor-item p {
        color: #ccc;
      }

      footer {
        text-align: center;
        padding: 20px;
        background: rgba(51, 51, 51, 0.8);
        color: #ccc;
        position: fixed;
        width: 100%;
        bottom: 0;
        box-shadow: 0 -4px 8px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
      }
    </style>
    <link rel="stylesheet" href="/static/css/theme.css" />
